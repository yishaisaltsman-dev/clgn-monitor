name: CLGN monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clgn-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' }}
        run: python monitor.py

      - name: Save state
        if: always()
        run: |
          git config user.name "clgn-bot"
          git config user.email "clgn-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
